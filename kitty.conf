# =============================================================================
#  Kitty Configuration
#  Ported from Alacritty + Enhancements
# =============================================================================

# -----------------------------------------------------------------------------
#  Font Configuration
# -----------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Adjust line height and letter spacing for readability
adjust_line_height  0
adjust_column_width 0

# Enable ligatures (JetBrains Mono supports these)
disable_ligatures never

# -----------------------------------------------------------------------------
#  Cursor
# -----------------------------------------------------------------------------
cursor                  #ffffff
cursor_text_color       #1d1f21
cursor_shape            block
cursor_blink_interval   0
cursor_stop_blinking_after 0

# -----------------------------------------------------------------------------
#  Scrollback
# -----------------------------------------------------------------------------
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# -----------------------------------------------------------------------------
#  Mouse
# -----------------------------------------------------------------------------
mouse_hide_wait         3.0
copy_on_select          clipboard
strip_trailing_spaces   smart

# -----------------------------------------------------------------------------
#  Window Layout
# -----------------------------------------------------------------------------
remember_window_size    no
initial_window_width    120c
initial_window_height   40c
window_padding_width    5
hide_window_decorations no

# Transparency (same as your Alacritty 0.9)
background_opacity      0.9

# Blur (looks great with transparency)
# background_blur         20

# -----------------------------------------------------------------------------
#  Terminal Settings
# -----------------------------------------------------------------------------
term                    xterm-256color
shell_integration       enabled
confirm_os_window_close 0

# -----------------------------------------------------------------------------
#  Color Scheme (Ported from your Alacritty config)
# -----------------------------------------------------------------------------

# Primary colors
foreground              #c5c8c6
background              #1d1f21

# Normal colors
color0                  #1d1f21
color1                  #cc6666
color2                  #b5bd68
color3                  #e6c547
color4                  #81a2be
color5                  #b294bb
color6                  #70c0ba
color7                  #373b41

# Bright colors
color8                  #666666
color9                  #ff3334
color10                 #9ec400
color11                 #f0c674
color12                 #81a2be
color13                 #b77ee0
color14                 #54ced6
color15                 #282a2e

# Selection colors
selection_foreground    #1d1f21
selection_background    #c5c8c6

# -----------------------------------------------------------------------------
#  Keyboard Shortcuts
# -----------------------------------------------------------------------------

# Clear terminal (like your tmux bind)
# map ctrl+l              combine : clear_terminal scrollback active : send_text normal,application \x0c

# Font size adjustments
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0

# Copy/Paste
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

# Open new OS window (not kitty tabs since you use tmux)
map ctrl+shift+n        new_os_window_with_cwd

# Quickly open URLs with keyboard
map ctrl+shift+e        open_url_with_hints

# Reload config
map ctrl+shift+f5       load_config_file

# -----------------------------------------------------------------------------
#  Tabs
# -----------------------------------------------------------------------------
# Tab bar style
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
tab_title_template      "  {index}: {title}  "

# Tab colors
active_tab_foreground   #1d1f21
active_tab_background   #b5bd68
active_tab_font_style   bold
inactive_tab_foreground #c5c8c6
inactive_tab_background #373b41
inactive_tab_font_style normal

# Tab shortcuts
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+w        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+.        move_tab_forward
map ctrl+shift+,        move_tab_backward

# Jump to specific tab (Alt+1 through Alt+9)
map alt+1               goto_tab 1
map alt+2               goto_tab 2
map alt+3               goto_tab 3
map alt+4               goto_tab 4
map alt+5               goto_tab 5
map alt+6               goto_tab 6
map alt+7               goto_tab 7
map alt+8               goto_tab 8
map alt+9               goto_tab 9

# Rename tab (prompts for new name)
map ctrl+shift+alt+t    set_tab_title

# -----------------------------------------------------------------------------
#  Performance
# -----------------------------------------------------------------------------
repaint_delay           10
input_delay             3
sync_to_monitor         yes

# -----------------------------------------------------------------------------
#  Bell
# -----------------------------------------------------------------------------
enable_audio_bell       no
visual_bell_duration    0.0

